name: Tests

# Static checks, the stub based suites, translations and packaging, on Arch
# Linux (the base of BigLinux): the generated .desktop/polkit files depend on
# the gettext version, so the same tools as on the users' systems are used.
# Nothing here touches a disk: tests/integration.sh needs a local session with
# UDisks2 and is run by hand (see docs/09-testing.md).
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git bash shellcheck gettext desktop-file-utils \
            libxml2 python glibc-locales util-linux systemd diffutils
          # The suites must not run as root: permission checks would be meaningless
          useradd --create-home ci

      - uses: actions/checkout@v4

      - name: Prepare the checkout for the test user
        run: chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Bash syntax
        run: |
          for f in big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
                   big-mount/usr/lib/big-mount/bigmount-holders tests/*.sh locale/*.sh \
                   pkgbuild/PKGBUILD pkgbuild/big-mount.install; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shellcheck -x -P big-mount/usr/lib/big-mount:tests \
            big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
            big-mount/usr/lib/big-mount/bigmount-holders locale/*.sh tests/stubs/* \
            $(ls tests/*.sh | grep -v bigmount.old.sh)

      - name: Boot path (stubbed devices)
        run: runuser -u ci -- bash tests/run-tests.sh new

      - name: Library
        run: runuser -u ci -- bash tests/lib-tests.sh

      - name: Translations
        run: runuser -u ci -- bash tests/i18n-tests.sh

      - name: Packaging
        run: runuser -u ci -- bash tests/package-check.sh
