# Big-Mount configuration (read at boot by /usr/bin/bigmount).
# Lines are KEY=value; anything else is ignored. Changes apply at the next
# boot or after: sudo systemctl restart big-mount
#
# PERMISSIONS: who may write to INTERNAL FAT, exFAT and NTFS partitions that
# Big-Mount mounts under /mnt. These filesystems have no owners of their own,
# so the mount options decide for every file. Other filesystems (ext4, Btrfs,
# XFS...) keep their own permissions and are not affected.
#
#   shared   every local account can read, write and run files (default,
#            the behaviour of all previous versions; good for a family PC or
#            for services such as Samba or media servers)
#   owner    only the last user who logged in can write; everyone can read
#   private  only the last user who logged in can read and write
PERMISSIONS=shared

# APFS: partitions of a Mac on an INTERNAL disk (external disks are never
# mounted at boot; open them with: bigmount --open-apfs).
#
#   off       not mounted at boot (default); bigmount --open-apfs opens them
#   readonly  mounted read-only under /mnt at boot: the volume with the files
#             of the users, owned by the last user who logged in. Encrypted
#             (FileVault) volumes are skipped: they need a password.
#
# An APFS driver must be installed: apfs-fuse (AUR apfs-fuse-git) or the
# kernel driver (linux-apfs-rw-dkms and apfsprogs). APFS is never mounted
# read-write.
APFS=off

# APFS_DRIVER: which driver reads APFS when both are installed.
#   auto     apfs-fuse, else the kernel driver (default)
#   fuse     only apfs-fuse
#   kernel   only the kernel driver (faster; cannot read encrypted volumes)
APFS_DRIVER=auto
