# Big-Mount configuration (read at boot by /usr/bin/bigmount).
# Lines are KEY=value; anything else is ignored. Changes apply at the next
# boot or after: sudo systemctl restart big-mount
#
# PERMISSIONS: who may write to INTERNAL FAT, exFAT and NTFS partitions that
# Big-Mount mounts under /mnt. These filesystems have no owners of their own,
# so the mount options decide for every file. Other filesystems (ext4, Btrfs,
# XFS...) keep their own permissions and are not affected.
#
#   shared   every local account can read, write and run files (default,
#            the behaviour of all previous versions; good for a family PC or
#            for services such as Samba or media servers)
#   owner    only the last user who logged in can write; everyone can read
#   private  only the last user who logged in can read and write
PERMISSIONS=shared
