name: Tests

# Static checks and the stub based test suites. They never touch a disk.
# tests/integration.sh needs a local session with UDisks2 and is run by hand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck gettext

      - name: Syntax
        run: |
          for f in big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
                   big-mount/usr/lib/big-mount/bigmount-holders tests/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shellcheck -x -P big-mount/usr/lib/big-mount:tests \
            big-mount/usr/bin/bigmount big-mount/usr/lib/big-mount/*.sh \
            big-mount/usr/lib/big-mount/bigmount-holders

      - name: Translations compile
        run: msgfmt --check -o /dev/null locale/pt_BR.po

      - name: Boot path (stubbed devices)
        run: bash tests/run-tests.sh new

      - name: Library
        run: bash tests/lib-tests.sh
